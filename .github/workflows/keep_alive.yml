name: Render Anti-Cold-Start Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier from sleeping (Render sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          URL="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://razorpay-checkout-agent.onrender.com/api/health"
          fi
          echo "Pinging Render service: $URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "HTTP Response Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success: Render service is awake and healthy!"
          else
            echo "Warning: Service returned HTTP $HTTP_STATUS"
          fi
